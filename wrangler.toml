name = "luckmail"
main = "worker/src/index.ts"

# 打包配置
minify = true # 生产环境压缩代码
compatibility_flags = [ "nodejs_compat" ]
compatibility_date = "2025-03-01"
keep_vars = true

# 启用 D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "luckmail"  # 替换为您的实际的数据库 NAME
database_id = "7a864a7f-0f54-4b5f-b437-84e04c2876a5"  # 需要替换为您的实际数据库 ID

# 设置域名
[vars]
VITE_EMAIL_DOMAIN = "mail.niubige.top"   # 替换为您的域名列表，多个域名使用逗号 , 分割。这里的域名只是用来网页上展示，方便复制粘贴使用。

# API 访问密钥 LUCKMAIL_API_KEY 不在这里配置：
# 生产环境在 Cloudflare Dashboard「设置 → 运行时变量和密钥」中以「密钥」类型添加，
# 本地开发在项目根目录 .dev.vars 中配置（该文件已被 .gitignore 忽略）。
# 所有 /api/* 接口必须携带此密钥（Authorization: Bearer / X-API-Key / ?key=）。

# 配置邮件处理
[triggers]
crons = ["0 * * * *"]  # 每小时运行一次清理任务

[build]
command = "pnpm run build"

[assets]
binding = "ASSETS"
directory = "frontend/dist"
not_found_handling = "single-page-application"

# 默认开启日志，方便调试
[observability]
enabled = false
head_sampling_rate = 1 # optional. default = 1.
